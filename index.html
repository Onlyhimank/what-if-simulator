<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>what-if-simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const builtAppLoaded = document.querySelector('script[src$="/assets/app.js"]');

      if (location.hostname.endsWith("github.io") && !builtAppLoaded) {
        const style = document.createElement("link");
        style.rel = "stylesheet";
        style.href = "/what-if-simulator/assets/index.css";
        document.head.appendChild(style);

        const appScript = "/what-if-simulator/assets/app.js";
        import(appScript);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
